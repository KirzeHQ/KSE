<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KSE Home</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="description" content="KSE">
  <meta name="api-base" content="">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <section class="hero">
      <h2>Search</h2>
      <p class="muted">Search is not ready yet.</p>

      <form id="search-form" class="search-bar" action="/search/" method="get">
        <input id="search-input" name="q" type="text" placeholder="Enter query" aria-label="Search">
        <button type="submit">Search</button>
      </form>
      <p style="margin-top:12px">New here? <a href="/acc/register/">Create an account</a></p>
    </section>

    <!-- results will be rendered on the server-driven search page -->
  </main>

  <div id="site-footer"></div>

  <script src="/js/site_layout.js"></script>
  <script>
    document.getElementById('search-form').addEventListener('submit', function(e){
      e.preventDefault();
      var q = document.getElementById('search-input').value.trim();
      if(!q) return;
      window.location.href = '/search/?q=' + encodeURIComponent(q);
    });
  </script>
</body>
</html>
