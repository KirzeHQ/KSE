<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KSE Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <section class="hero">
      <h2>Dashboard</h2>
      <div id="content" class="muted">Loading...</div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/js/site_layout.js"></script>

  <script>
    // redirect to login if not authenticated
    var secret = null;
    try { secret = localStorage.getItem('kse_secret'); } catch(e){}
    if(!secret) {
      var next = encodeURIComponent('/acc/dashboard/');
      window.location.replace('/acc/login/?next=' + next);
    }

    var siteYearEl = document.getElementById('site-year');
    if (siteYearEl) siteYearEl.textContent = new Date().getFullYear();
    var content = document.getElementById('content');
    if(secret){
      content.innerHTML = '';

      var info = document.createElement('div');
      info.textContent = 'You are logged in.';
      content.appendChild(info);

      // Logout
      var btn = document.createElement('button'); btn.textContent = 'Logout'; btn.className='btn-ghost'; btn.style.display='inline-block'; btn.style.marginTop='12px';
      btn.addEventListener('click', function(){ try { localStorage.removeItem('kse_secret'); } catch(e){}; window.location.href = '/'; });
      content.appendChild(btn);

      // API Keys UI
      var keysSection = document.createElement('div'); keysSection.style.marginTop = '18px';
      var h = document.createElement('h3'); h.textContent = 'API Keys'; keysSection.appendChild(h);

      var indexerBox = document.createElement('div');
      var indexerTitle = document.createElement('h4'); indexerTitle.textContent = 'Indexer Keys'; indexerBox.appendChild(indexerTitle);
      var indexerList = document.createElement('div'); indexerList.id = 'indexer-keys'; indexerBox.appendChild(indexerList);
      var createIndexerBtn = document.createElement('button'); createIndexerBtn.textContent = 'Create Indexer Key'; createIndexerBtn.className='btn'; createIndexerBtn.style.marginTop='8px';
      indexerBox.appendChild(createIndexerBtn);

      keysSection.appendChild(indexerBox);
      content.appendChild(keysSection);

      function authHeaders(){ return { 'Accept': 'application/json', 'Authorization': 'Bearer '+secret, 'Content-Type': 'application/json' }; }

      async function loadKeys(){
        try{
          const res = await fetch('/api/v1/acc/keys', { headers: authHeaders() });
          if(!res.ok) throw new Error('Failed to load keys');
          const data = await res.json();
          const keys = data.keys || [];
          indexerList.innerHTML = '';
          for(const k of keys){
            if (k.kind !== 'indexer') continue;
            const el = document.createElement('div');
            el.style.borderTop='1px solid #eee'; el.style.padding='8px 0';
            el.textContent = `${k.name || '(no name)'} — ${k.revoked ? 'revoked' : 'active'} — ${new Date(k.created_at).toLocaleString()}`;
            if(!k.revoked){
              const r = document.createElement('button'); r.textContent='Revoke'; r.className='btn-ghost'; r.style.marginLeft='8px';
              r.addEventListener('click', async ()=>{
                try{
                  const rr = await fetch('/api/v1/acc/keys/'+k.id, { method: 'DELETE', headers: authHeaders() });
                  if(!rr.ok) throw new Error('Revoke failed');
                  loadKeys();
                }catch(e){ alert('Revoke failed'); }
              });
              el.appendChild(r);
            }
            indexerList.appendChild(el);
          }
        }catch(e){
          indexerList.textContent = 'Failed to load keys';
        }
      }

      createIndexerBtn.addEventListener('click', async ()=>{
        const name = prompt('Name for this indexer key (optional)');
        try{
          const res = await fetch('/api/v1/acc/keys', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ kind: 'indexer', name: name }) });
          if(!res.ok) throw new Error('create failed');
          const data = await res.json();
          // show token to user once
          alert('API key created. Token: ' + data.token + '\nSave this now — it will not be shown again.');
          loadKeys();
        }catch(e){ alert('Failed to create key'); }
      });

      loadKeys();
    }
  </script>
</body>
</html>
