<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KSE Home</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="api-base" content="https://api.example.com">
  <meta name="description" content="KSE">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo">KSE</h1>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Search</h2>
      <p class="muted">Search is not ready yet.</p>

      <form id="search-form" class="search-bar" action="/search/" method="get">
        <input id="search-input" name="q" type="text" placeholder="Enter query" aria-label="Search">
        <button type="submit">Search</button>
      </form>
    </section>

    <!-- results will be rendered on the server-driven search page -->
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> KSE</div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('search-form').addEventListener('submit', function(e){
      e.preventDefault();
      var q = document.getElementById('search-input').value.trim();
      if(!q) return;
      // Redirect to the client-driven search page with query param
      window.location.href = '/search/?q=' + encodeURIComponent(q);
    });
  </script>
</body>
