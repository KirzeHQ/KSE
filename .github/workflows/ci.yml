name: CI

on:
  pull_request:
  merge_group:
  push:


permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:

          - name: Check for common security misconfigurations
            run: bundle exec rails_best_practices --only=security
          # Not completing
          #- name: Prettier check - Indexer area
          #  run: npx prettier --check "indexer/**.{js,jsx,css,scss,html}"

          - name: Zeitwerk check
            run: bin/rails zeitwerk:check

          - name: Scan for common Rails security vulnerabilities using static analysis
            run: bin/brakeman --no-pager
      
          - name: Scan for known security vulnerabilities in gems used
            run: bin/bundler-audit

          - name: RuboCop
            run: bin/rubocop -f github
      
    name: ${{ matrix.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Sys Depends
        run: sudo apt-get update && sudo apt-get install -y libvips-dev libpq-dev libblas-dev liblapack-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Bundle install
        run: bundle install --jobs 4 --retry 3

      #- name: Install JS dependencies
      #  run: npm ci
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor/bundle
            tmp/rubocop
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

  db_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/test
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev

      - name: Install Postgres on runner (fallback to avoid Docker Hub pulls)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates lsb-release gnupg
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-15 postgresql-client-15 libpq-dev
          sudo pg_ctlcluster 15 main start || sudo systemctl start postgresql || true
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'password';" || true
          sudo -u postgres createdb -O postgres test || true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Check schema matches migrations
        id: migration_check
        run: |
          USE_CURRENT_DB=1 bundle exec rake db:regenerate_schema
          git diff --exit-code db/schema.rb
      - name: Comment on schema failure
        if: failure() && steps.migration_check.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### :rage2: \n Schema dump has fallen out of date\n\nRegenerate locally and commit the changes to \`db/schema.rb\`. For example:\n\n\`docker compose exec api bin/rails db:regenerate_schema\`\n\nOr to use a temporary Postgres container locally:\n\`docker compose exec api bash -lc "USE_TEMP_PG=1 bin/rails db:regenerate_schema"\``
            });

      - name: Check annotations are up to date
        id: annotate_check
        if: success()
        run: bundle exec annotaterb models --frozen
      - name: Show annotaterb diff
        if: failure() && steps.annotate_check.outcome == 'failure'
        run: |
          # Run annotaterb (non-frozen) and print the model diffs so logs show exact changes
          bundle exec annotaterb models || true
          echo "---- git diff: app/models ----"
          git --no-pager diff -- app/models || true
      - name: Comment on annotation failure
        if: failure() && steps.annotate_check.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### :rage1: \n Model annotations have fallen out of date\n\nPlease run \`docker compose exec api bundle exec annotaterb models\` locally and commit the changes.`
            });
