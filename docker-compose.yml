version: '3.9'

services:
  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    command: bundle exec rails s -b 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT}:3000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  db_data: