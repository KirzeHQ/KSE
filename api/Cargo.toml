[package]
name = "kse-api"
version = "0.1.0"
edition = "2024"

[dependencies]

# Web framework
actix-web = "4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CORS & logging
actix-cors = "0.6"
env_logger = "0.10"
log = "0.4"
 
# Environment/config
dotenvy = "0.15"

# Utilities
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["rustls-tls"] }
hmac = "0.12"
hex = "0.4"
tar = "0.4"
flate2 = { version = "1.1", features = ["zlib"] }
